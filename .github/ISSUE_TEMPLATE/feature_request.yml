name: Feature request
description: Suggest a monitoring rule, CLI command, notification channel, or safety improvement
title: "[Feature]: "
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the command, configuration, or workflow.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy considerations
      description: Mention confirmation, protected processes, notifications, or data handling if relevant.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
