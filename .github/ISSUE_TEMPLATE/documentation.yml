name: Documentation improvement
description: Report unclear, missing, or outdated documentation
title: "[Docs]: "
labels: [documentation]

body:
  - type: input
    id: page
    attributes:
      label: Document or section
      placeholder: "docs/installation.md"
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
