version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:17"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:17"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
